name: clustersnake
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  # Build dependency for installing this checkout with `python -m pip install .`.
  # Keeping it explicit also supports legacy cluster environments that invoke
  # setup.py directly without PEP 517 build isolation.
  - setuptools>=61
  - numpy 
  - psutil
  - pyyaml
  - tabulate
