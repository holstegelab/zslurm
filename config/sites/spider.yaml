# Spider pilot defaults. Copy/merge into ~/.zslurm/config.yaml and review the
# enabled autogrow cap before starting the manager.
cluster_site: spider
default_partition: normal
staging_partition: staging
enable_ssd_prompt: true
ssd_feature_name: ssd
# Spider binds this allocation's local SSD at $TMPDIR. The chief validates the
# path inside the Slurm pilot before advertising SSD capacity to ZSlurm.
ssd_scratch_root: "$TMPDIR"
# Spider grants 80 decimal GB of scratch per requested core. A 30-core pilot
# therefore receives about 2235 GiB; keep a small safety margin below that.
ssd_capacity_gb: 2200

# Spider's Slurm policy grants 8 GB per allocated core. These values describe
# a 30-core partial pilot allocation, not all physical resources on the node.
default_engine_cores: 30
autogrow_engine_cores: 30
node_profiles:
  normal:
    cores: 30
    mem_gb: 240
autogrow_prefer_partitions:
  - [normal, true]
autogrow_fallback_partition: normal
autogrow_fat_partitions: []

# At 30 cores per partial pilot this permits at most 450 allocated cores across
# running and queued compute pilots. Runtime control can lower/disable the cap.
autogrow_enable: true
autogrow_max_compute_nodes: 15
maintenance_window_enable: false
